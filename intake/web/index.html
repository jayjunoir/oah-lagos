<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <title>OAH Lagos Field Logger (Offline PWA)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; max-width: 620px; margin: 0 auto; background: #f8fafc; color: #0f172a; }
    h2 { color: #0284c7; margin-bottom: 4px; }
    .network-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-bottom: 12px; }
    .online { background: #dcfce7; color: #166534; }
    .offline { background: #fee2e2; color: #991b1b; }
    .queue-badge { background: #fef3c7; color: #92400e; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
    .card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; }
    label { display: block; font-weight: 600; margin-top: 10px; font-size: 0.85rem; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 1rem; width: 100%; cursor: pointer; margin-top: 12px; font-weight: 600; }
    .row { display: flex; gap: 8px; }
    #msg { margin-top: 10px; padding: 10px; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <h2>OAH Lagos Field Logger</h2>
  <div>
    <span id="netStatus" class="network-badge online">Checking connection...</span>
    <span id="queueStatus" class="queue-badge">Buffered Offline: 0</span>
  </div>

  <div class="card">
    <label>Site ID & Name</label>
    <div class="row">
      <input type="text" id="site_id" value="lagos-somolu-drain-01">
      <input type="text" id="site_name" value="Somolu Secondary Drain">
    </div>
    <label>Coordinates</label>
    <div class="row">
      <input type="number" step="any" id="lat" value="6.5355">
      <input type="number" step="any" id="lon" value="3.3784">
    </div>
    <button type="button" onclick="getGPS()" style="background:#0ea5e9;">Acquire GPS Location</button>
  </div>

  <div class="card">
    <h3>Physico-Chemical Measurements</h3>
    <label>Water Temp (°C)</label><input type="number" step="0.1" id="temp" value="29.8">
    <label>pH (0 - 14)</label><input type="number" step="0.1" id="ph" value="6.9">
    <label>Dissolved Oxygen (mg/L)</label><input type="number" step="0.1" id="do" value="1.8">
    <label>Turbidity (NTU)</label><input type="number" step="0.1" id="turb" value="48.0">
  </div>

  <div class="card">
    <h3>Tropical Context Variables</h3>
    <label>Channel Morphology</label>
    <select id="channel_type">
      <option value="open_concrete_drain">Open Concrete U-Drain</option>
      <option value="concrete_channel">Engineered Concrete Canal</option>
      <option value="natural_stream">Natural Stream</option>
      <option value="lagoon_adjacent">Lagoon Adjacent</option>
    </select>
    <label>Mosquito Larvae Density (Vector Risk)</label>
    <select id="mosquito_larvae">
      <option value="high_over_10_per_dip">High (>10 larvae/dip)</option>
      <option value="low_1_10_per_dip">Low (1-10 larvae/dip)</option>
      <option value="none">None Detected</option>
    </select>
    <label>Solid Waste Obstruction</label>
    <select id="waste_severity">
      <option value="choked_flow_obstructed">Choked / Stagnated by Waste</option>
      <option value="moderate_bank_litter">Moderate Litter on Bank</option>
      <option value="none">Clean</option>
    </select>
  </div>

  <button type="button" onclick="handleRecordSubmission()">Record Observation</button>
  <button type="button" id="manualSyncBtn" onclick="syncOfflineQueue()" style="background:#059669; display:none;">Manual Sync Offline Buffer</button>
  <div id="msg"></div>

  <script>
    // 1. Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }

    // 2. Setup IndexedDB Queue
    let db;
    const dbReq = indexedDB.open('OahLagosOfflineDB', 1);
    dbReq.onupgradeneeded = (e) => {
      e.target.result.createObjectStore('observations', { keyPath: 'id', autoIncrement: true });
    };
    dbReq.onsuccess = (e) => {
      db = e.target.result;
      updateQueueBadge();
    };

    // 3. Online/Offline Network Status
    function updateNetStatus() {
      const badge = document.getElementById('netStatus');
      const syncBtn = document.getElementById('manualSyncBtn');
      if (navigator.onLine) {
        badge.className = 'network-badge online';
        badge.innerText = 'Online — Live Sync Enabled';
        syncBtn.style.display = 'block';
        syncOfflineQueue();
      } else {
        badge.className = 'network-badge offline';
        badge.innerText = 'Offline — Saving Locally (IndexedDB)';
        syncBtn.style.display = 'none';
      }
    }
    window.addEventListener('online', updateNetStatus);
    window.addEventListener('offline', updateNetStatus);
    updateNetStatus();

    function updateQueueBadge() {
      if (!db) return;
      const tx = db.transaction('observations', 'readonly');
      const countReq = tx.objectStore('observations').count();
      countReq.onsuccess = () => {
        document.getElementById('queueStatus').innerText = `Buffered Offline: ${countReq.result}`;
      };
    }

    function getGPS() {
      navigator.geolocation.getCurrentPosition(
        p => {
          document.getElementById('lat').value = p.coords.latitude.toFixed(6);
          document.getElementById('lon').value = p.coords.longitude.toFixed(6);
        },
        e => alert('GPS acquisition error: ' + e.message)
      );
    }

    // 4. Client-side OAH Shape Validation
    function validateInput(payload) {
      if (!payload.site_id || !payload.site_name) throw new Error("Site ID and Name are required.");
      if (isNaN(payload.latitude) || isNaN(payload.longitude)) throw new Error("Valid GPS coordinates are required.");
      if (payload.ph !== null && (payload.ph < 0 || payload.ph > 14)) throw new Error("pH must be between 0 and 14.");
      if (payload.dissolved_oxygen_mg_l !== null && payload.dissolved_oxygen_mg_l < 0) throw new Error("DO cannot be negative.");
      if (payload.turbidity_ntu !== null && payload.turbidity_ntu < 0) throw new Error("Turbidity cannot be negative.");
    }

    async function handleRecordSubmission() {
      const payload = {
        site_id: document.getElementById('site_id').value,
        site_name: document.getElementById('site_name').value,
        latitude: parseFloat(document.getElementById('lat').value),
        longitude: parseFloat(document.getElementById('lon').value),
        timestamp: new Date().toISOString(),
        water_temp_celsius: parseFloat(document.getElementById('temp').value) || null,
        ph: parseFloat(document.getElementById('ph').value) || null,
        dissolved_oxygen_mg_l: parseFloat(document.getElementById('do').value) || null,
        turbidity_ntu: parseFloat(document.getElementById('turb').value) || null,
        channel_type: document.getElementById('channel_type').value,
        mosquito_larvae: document.getElementById('mosquito_larvae').value,
        waste_severity: document.getElementById('waste_severity').value
      };

      const m = document.getElementById('msg');
      m.style.display = 'block';

      try {
        validateInput(payload);
      } catch (err) {
        m.style.background = '#fecaca';
        m.innerText = 'Validation Error: ' + err.message;
        return;
      }

      if (!navigator.onLine) {
        // Buffer into IndexedDB
        const tx = db.transaction('observations', 'readwrite');
        tx.objectStore('observations').add(payload);
        tx.oncomplete = () => {
          updateQueueBadge();
          m.style.background = '#fef3c7';
          m.innerText = 'Offline: Observation validated and queued in IndexedDB. Will sync when connectivity returns.';
        };
        return;
      }

      // Online: Live Post
      try {
        const res = await fetch('/api/v1/observations', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          m.style.background = '#bbf7d0';
          m.innerText = `Ingested live into HAPI FHIR! ID: ${data.fhir_observation_id}`;
        } else {
          throw new Error(JSON.stringify(data.detail));
        }
      } catch (e) {
        // Fallback to queue if network dropped midway
        const tx = db.transaction('observations', 'readwrite');
        tx.objectStore('observations').add(payload);
        tx.oncomplete = () => {
          updateQueueBadge();
          m.style.background = '#fef3c7';
          m.innerText = 'Network failed. Fallback: Saved locally in IndexedDB.';
        };
      }
    }

    // 5. Transaction Bundle Sync
    async function syncOfflineQueue() {
      if (!db || !navigator.onLine) return;
      const tx = db.transaction('observations', 'readonly');
      const getAllReq = tx.objectStore('observations').getAll();

      getAllReq.onsuccess = async () => {
        const queue = getAllReq.result;
        if (!queue || queue.length === 0) return;

        try {
          const res = await fetch('/api/v1/observations/bundle', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(queue)
          });
          const data = await res.json();
          if (res.ok && data.status === 'success') {
            // Clear synced items
            const clearTx = db.transaction('observations', 'readwrite');
            clearTx.objectStore('observations').clear();
            clearTx.oncomplete = () => {
              updateQueueBadge();
              const m = document.getElementById('msg');
              m.style.display = 'block';
              m.style.background = '#bbf7d0';
              m.innerText = `Synced ${data.synced_count} offline records into HAPI as a FHIR Transaction Bundle!`;
            };
          }
        } catch (err) {
          console.warn('Queue flush deferred: network unavailable.', err);
        }
      };
    }
  </script>
</body>
</html>
