services:
  postgres:
    image: postgres:15-alpine
    container_name: oah-lagos-db
    environment:
      POSTGRES_DB: hapi_fhir
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapipassword
    volumes:
      - hapi_db_data:/var/lib/postgresql/data:Z
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi_fhir"]
      interval: 5s
      timeout: 5s
      retries: 5

  hapi-fhir:
    image: hapiproject/hapi:v6.8.0
    container_name: oah-lagos-fhir
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.reuse_cached_search_results_millis: -1
      hapi.fhir.cors.allowed_origin: "*"
      spring.datasource.url: jdbc:postgresql://postgres:5432/hapi_fhir
      spring.datasource.username: hapi
      spring.datasource.password: hapipassword
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

volumes:
  hapi_db_data:
